<div class="form-container slide-in">
<form (ngSubmit)="submitPerson()">
  <label>Full Name:</label>
  <input type="text" [(ngModel)]="person.fullName" name="fullName" required />
  
  <label>Email:</label>
  <input type="email" [(ngModel)]="person.email" name="email" required />
  
  <label>Address:</label>
  <input type="text" [(ngModel)]="person.address" name="address" required />

  <label>City:</label>
  <input type="text" [(ngModel)]="person.city" name="city" required />

  <label>State:</label>
  <input type="text" [(ngModel)]="person.state" name="state" required />

  <label>Zip Code:</label>
  <input type="text" [(ngModel)]="person.zipCode" name="zipCode" required />

  <label>Phone:</label>
  <input type="text" [(ngModel)]="person.phone" name="phone" required />

  <button type="submit">Save Person</button>
</form>

</div>
