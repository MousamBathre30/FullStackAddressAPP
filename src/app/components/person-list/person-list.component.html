<table *ngIf="contacts.length > 0">
  <tr>
    <th>Full Name</th>
    <th>Email</th>
    <th>Address</th>
    <th>City</th>
    <th>State</th>
    <th>Zip Code</th>
    <th>Phone</th>
    <th>Actions</th>
  </tr>
  <tr *ngFor="let person of contacts">
    <td>{{ person.fullName }}</td>
    <td>{{ person.email }}</td>
    <td>{{ person.address }}</td>
    <td>{{ person.city }}</td>
    <td>{{ person.state }}</td>
    <td>{{ person.zipCode }}</td>
    <td>{{ person.phone }}</td>
    <td>
      <button (click)="deletePerson(person.id!)">Delete</button>
    </td>
  </tr>
</table>

<p *ngIf="contacts.length === 0">No contacts available.</p> <!-- ✅ Show message if no data -->
<button (click)="navigateToAddPerson()">Add Person</button>
