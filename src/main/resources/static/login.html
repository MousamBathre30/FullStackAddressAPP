<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="w-full max-w-lg bg-white rounded-lg shadow-lg">
    <div class="bg-blue-500 text-white text-center py-4 rounded-t-lg relative">
        <h2 class="text-xl font-semibold">PERSON ADDRESS FORM</h2>
        <button class="absolute top-2 right-2 text-white">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="p-6">
        <form>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="fullName">Full Name</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="fullName" type="text" placeholder="Full Name">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="phoneNumber">Phone Number</label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="phoneNumber" type="text" placeholder="Phone Number">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="address">Address</label>
                <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="address" placeholder="Address"></textarea>
            </div>
            <div class="flex mb-4">
                <div class="w-1/3 pr-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="city">City</label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="city">
                        <option>Select City</option>
                    </select>
                </div>
                <div class="w-1/3 px-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="state">State</label>
                    <select class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="state">
                        <option>Select State</option>
                    </select>
                </div>
                <div class="w-1/3 pl-2">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="zipCode">Zip Code</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="zipCode" type="text" placeholder="Zip Code">
                </div>
            </div>
            <div class="flex justify-end">
                <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l focus:outline-none focus:shadow-outline" type="button">
                    Add
                </button>
                <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-r focus:outline-none focus:shadow-outline" type="button">
                    Reset
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
